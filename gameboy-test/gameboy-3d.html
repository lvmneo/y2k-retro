
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel World — 3D Game Boy</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #a977cf, #271636 75%);
      color: white;
      font: 15px Arial, sans-serif;
    }

    main {
      max-width: 1150px;
      margin: 30px auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      color: #ffe1fc;
      text-shadow: 0 0 16px #ff8bd5;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr);
      gap: 18px;
    }

    .panel {
      min-width: 0;
      padding: 17px;
      background: #251432c9;
      border: 2px solid #e6b9ff;
      border-radius: 18px;
      box-shadow: 0 0 35px #ffb7fb44;
    }

    #viewer {
      height: 530px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: radial-gradient(circle, #9a67ba55, #140e1b66);
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .tip {
      font-size: 13px;
      color: #f4c7f6;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    input::file-selector-button {
      background: #f1b8fa;
      color: #37183c;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
    }

    #game {
      width: 100%;
      aspect-ratio: 3 / 2;
      margin-top: 14px;
      background: #100c19;
      border-radius: 8px;
      overflow: hidden;
    }

    #status,
    #model-status {
      color: #f9d7fb;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    input { max-width: 100%; }

    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
      #viewer { height: 400px; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main>
    <h1>🎀 Pixel World — 3D Game Boy Advance</h1>

    <div class="layout">
      <section class="panel">
        <h2>3D-приставка</h2>

        <div id="viewer"></div>

        <p id="model-status">Загружаем 3D-модель…</p>

        <div class="controls">
          <button id="reset">Вернуть ракурс</button>
          <button id="spin">Автовращение: выкл.</button>
        </div>

        <p class="tip">
          Перетаскивай мышкой, чтобы вращать приставку.
          Колёсико меняет масштаб.
        </p>
      </section>

      <section class="panel">
        <h2>Игра Hello Kitty</h2>

        <p class="tip">
          Выбери файл .gba. Он остаётся на твоём компьютере.
        </p>

        <input id="rom" type="file" accept=".gba">

        <p id="status">Ожидание файла…</p>

        <div id="game"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const viewer = document.querySelector('#viewer');
    const label = document.querySelector('#model-status');

    // Если модель находится в assets, замени на './assets/gba.glb'
    const MODEL_URL = './gba.glb';

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      40, 1, 0.01, 1000
    );

    camera.position.set(0, 0, 6);

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x6b417f, 3));

    const key = new THREE.DirectionalLight(0xffffff, 3);
    key.position.set(4, 7, 9);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xd69dff, 2);
    fill.position.set(-6, -3, -4);
    scene.add(fill);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.1;

    let model = null;
    let defaultCameraPosition = new THREE.Vector3(0, 0, 6);

    function fitModel(object) {
      const bounds = new THREE.Box3().setFromObject(object);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      if (bounds.isEmpty()) {
        throw new Error('В модели не обнаружена геометрия.');
      }

      // Центрируем модель в сцене
      object.position.sub(center);

      const largest = Math.max(size.x, size.y, size.z);
      const scale = 3 / largest;
      object.scale.setScalar(scale);

      // Учитываем масштаб и положение после центрирования
      const scaledBounds = new THREE.Box3().setFromObject(object);
      const scaledCenter = scaledBounds.getCenter(new THREE.Vector3());
      object.position.sub(scaledCenter);

      const scaledSize = scaledBounds.getSize(new THREE.Vector3());

      const distance = Math.max(
        scaledSize.x, scaledSize.y, scaledSize.z
      ) * 2.2;

      defaultCameraPosition.set(0, 0, distance);

      camera.position.copy(defaultCameraPosition);
      camera.near = 0.01;
      camera.far = distance * 30;
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.update();
    }

    async function loadModel() {
      label.textContent = 'Проверяем gba.glb…';

      try {
        const response = await fetch(MODEL_URL, {
          method: 'GET'
        });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: файл ${MODEL_URL} не найден или недоступен`
          );
        }

        const contentType = response.headers.get('content-type') || '';

        if (contentType.includes('text/html')) {
          throw new Error(
            'Вместо 3D-модели сервер вернул HTML. Проверь путь к gba.glb.'
          );
        }

        const buffer = await response.arrayBuffer();

        if (buffer.byteLength < 20) {
          throw new Error('Файл модели пустой или повреждён.');
        }

        const signature = new TextDecoder().decode(
          new Uint8Array(buffer, 0, 4)
        );

        if (signature !== 'glTF') {
          throw new Error(
            'Файл не является корректным бинарным GLB. Проверь, что это gba.glb.'
          );
        }

        label.textContent = 'Обрабатываем 3D-модель…';

        const loader = new GLTFLoader();

        const gltf = await new Promise((resolve, reject) => {
          loader.parse(
            buffer,
            new URL(MODEL_URL, window.location.href).href
              .replace(/[^/]*$/, ''),
            resolve,
            reject
          );
        });

        model = gltf.scene;
        scene.add(model);

        fitModel(model);

        label.textContent = '✓ Модель загружена! Можно вращать.';

        console.log('GBA model loaded:', model);

        model.traverse(child => {
          if (child.isMesh) {
            console.log('Mesh:', child.name);
          }
        });

      } catch (error) {
        console.error('Ошибка загрузки Game Boy:', error);

        label.textContent =
          'Ошибка: ' + (error?.message || String(error));
      }
    }

    loadModel();

    function resize() {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;

      renderer.setSize(width, height, false);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(viewer);
    resize();

    function animate() {
      requestAnimationFrame(animate);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    document.querySelector('#reset').addEventListener('click', () => {
      if (!model) return;

      camera.position.copy(defaultCameraPosition);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    document.querySelector('#spin').addEventListener('click', event => {
      controls.autoRotate = !controls.autoRotate;

      event.currentTarget.textContent =
        'Автовращение: ' +
        (controls.autoRotate ? 'вкл.' : 'выкл.');
    });
  </script>

  <script>
    const input = document.querySelector('#rom');
    const status = document.querySelector('#status');

    let romURL;

    input.addEventListener('change', () => {
      const file = input.files?.[0];
      if (!file) return;

      if (!file.name.toLowerCase().endsWith('.gba')) {
        status.textContent = 'Нужен распакованный файл .gba (не ZIP).';
        return;
      }

      if (window.__started) {
        status.textContent = 'Для смены игры обнови страницу.';
        return;
      }

      window.__started = true;

      romURL = URL.createObjectURL(file);

      window.EJS_player = '#game';
      window.EJS_core = 'gba';
      window.EJS_gameUrl = romURL;
      window.EJS_pathtodata =
        'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;

      status.textContent = 'Загружаем эмулятор…';

      const script = document.createElement('script');

      script.src =
        'https://cdn.emulatorjs.org/stable/data/loader.js';

      script.onerror = () => {
        status.textContent =
          'Не удалось загрузить EmulatorJS.';
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
